name: CI/CD - Project Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/project/**'
      - 'shared/**'
      - '.github/workflows/project-service.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/project/**'
      - 'shared/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/project-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore services/project/ProjectService.Api/ProjectService.Api.csproj
      
    - name: Build
      run: dotnet build services/project/ProjectService.Api/ProjectService.Api.csproj --no-restore -c Release
      
    - name: Test
      run: dotnet test services/project/ProjectService.Tests/ProjectService.Tests.csproj --no-build --verbosity normal

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/project-service.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # Normally we would use helm to deploy to EKS/AKS/GKE here
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      
    - name: Set Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        
    - name: Update Deployment Image
      run: |
        kubectl set image deployment/project-service project-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
        kubectl rollout status deployment/project-service --timeout=120s
