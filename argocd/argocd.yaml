apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/techwmarcus/cns-crm.git
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: prod 
  
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
