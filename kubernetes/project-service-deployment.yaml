apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: construction-crm
  labels:
    app: project-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: project-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: project-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: project-service
        image: acr.example.com/construction-crm/project-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: grpc
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: connectionString
        - name: Redis__Configuration
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: connectionString
        - name: Auth0__Domain
          valueFrom:
            configMapKeyRef:
              name: auth0-config
              key: domain
        - name: Auth0__Audience
          valueFrom:
            configMapKeyRef:
              name: auth0-config
              key: audience
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: project-service
