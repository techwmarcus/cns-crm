apiVersion: v1
kind: Service
type: LoadBalancer
metadata:
  name: project-service
  namespace: prod
  labels:
    app: project-service
spec:
  type: ClusterIP
  selector:
    app: project-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
    - name: grpc
      protocol: TCP
      port: 8081
      targetPort: grpc
